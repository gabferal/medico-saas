{% extends "base.html" %}
{% block title %}Contabilidad{% endblock %}
{% block head %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
{% endblock %}

{% block content %}
<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6">
  <h1 class="text-2xl font-bold text-gray-800">Contabilidad</h1>
  <div class="flex gap-2 flex-wrap">
    <button onclick="abrirModal('ingreso')"
      class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-lg text-sm font-medium flex items-center gap-2 transition">
      <i class="fas fa-plus"></i> Ingreso
    </button>
    <button onclick="abrirModal('gasto')"
      class="bg-red-500 hover:bg-red-600 text-white px-4 py-2.5 rounded-lg text-sm font-medium flex items-center gap-2 transition">
      <i class="fas fa-minus"></i> Gasto
    </button>
    <a href="#" onclick="exportarCSV()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2.5 rounded-lg text-sm font-medium flex items-center gap-2 transition">
      <i class="fas fa-file-csv"></i> CSV
    </a>
  </div>
</div>

<!-- Filtros de período -->
<div class="bg-white rounded-xl shadow p-4 mb-5">
  <div class="flex flex-wrap items-end gap-3">
    <div>
      <label class="label-form">Desde</label>
      <input id="filtro-desde" type="date" class="input-form w-auto">
    </div>
    <div>
      <label class="label-form">Hasta</label>
      <input id="filtro-hasta" type="date" class="input-form w-auto">
    </div>
    <button onclick="cargarDatos()" class="bg-teal-600 text-white px-4 py-2.5 rounded-lg text-sm">
      <i class="fas fa-filter mr-1"></i>Filtrar
    </button>
    <button onclick="filtroMesActual()" class="text-teal-600 hover:bg-teal-50 border border-teal-200 px-4 py-2.5 rounded-lg text-sm">
      Mes actual
    </button>
  </div>
</div>

<!-- Tarjetas de resumen -->
<div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
  <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-5">
    <div class="text-sm font-medium text-emerald-700 mb-1">Total Ingresos</div>
    <div id="total-ingresos" class="text-2xl font-bold text-emerald-800">₲ 0</div>
  </div>
  <div class="bg-red-50 border border-red-200 rounded-xl p-5">
    <div class="text-sm font-medium text-red-700 mb-1">Total Gastos</div>
    <div id="total-gastos" class="text-2xl font-bold text-red-800">₲ 0</div>
  </div>
  <div id="card-saldo" class="bg-blue-50 border border-blue-200 rounded-xl p-5">
    <div class="text-sm font-medium text-blue-700 mb-1">Saldo</div>
    <div id="total-saldo" class="text-2xl font-bold text-blue-800">₲ 0</div>
  </div>
</div>

<!-- Tabla de movimientos -->
<div class="bg-white rounded-xl shadow overflow-hidden">
  <div class="px-5 py-4 border-b flex items-center justify-between">
    <h2 class="font-semibold text-gray-700">Movimientos</h2>
    <div class="flex gap-2">
      <button onclick="filtrarTipo('')" id="btn-todos" class="px-3 py-1.5 text-xs rounded-full bg-gray-800 text-white">Todos</button>
      <button onclick="filtrarTipo('ingreso')" id="btn-ingresos" class="px-3 py-1.5 text-xs rounded-full bg-gray-100 text-gray-600">Ingresos</button>
      <button onclick="filtrarTipo('gasto')" id="btn-gastos" class="px-3 py-1.5 text-xs rounded-full bg-gray-100 text-gray-600">Gastos</button>
    </div>
  </div>
  <div id="lista-movimientos" class="divide-y divide-gray-100">
    <div class="p-8 text-center text-gray-400">
      <i class="fas fa-spinner fa-spin text-2xl"></i>
    </div>
  </div>
</div>

<!-- ─── MODAL MOVIMIENTO ─── -->
<div id="modal-movimiento" class="hidden fixed inset-0 bg-black/50 z-50 flex items-start justify-center p-4 overflow-y-auto">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg my-8">
    <div class="flex items-center justify-between p-6 border-b">
      <h2 id="mov-titulo" class="text-xl font-bold text-gray-800">Nuevo Ingreso</h2>
      <button onclick="cerrarModal()" class="text-gray-400 hover:text-gray-600 text-xl">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <div class="p-6 space-y-4">
      <input type="hidden" id="mov-tipo">
      <div>
        <label class="label-form">Descripción *</label>
        <input id="mov-descripcion" type="text" placeholder="Ej: Consulta Dr. García, Compra insumos..." class="input-form">
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="label-form">Monto *</label>
          <input id="mov-monto" type="number" min="1" step="1000" placeholder="0" class="input-form">
        </div>
        <div>
          <label class="label-form">Moneda</label>
          <select id="mov-moneda" class="input-form">
            <option value="PYG">₲ Guaraníes (PYG)</option>
            <option value="USD">$ Dólares (USD)</option>
            <option value="BRL">R$ Reales (BRL)</option>
          </select>
        </div>
      </div>
      <div>
        <label class="label-form">Fecha *</label>
        <input id="mov-fecha" type="date" class="input-form">
      </div>
      <div>
        <label class="label-form">Categoría</label>
        <select id="mov-categoria" class="input-form">
          <option value="">— Sin categoría —</option>
        </select>
      </div>
      <div id="error-mov" class="hidden text-red-600 text-sm bg-red-50 px-4 py-2 rounded-lg"></div>
    </div>
    <div class="flex justify-end gap-3 p-6 border-t">
      <button onclick="cerrarModal()" class="px-5 py-2.5 text-gray-600 hover:bg-gray-100 rounded-lg transition">Cancelar</button>
      <button id="btn-guardar-mov" onclick="guardarMovimiento()"
        class="px-5 py-2.5 bg-teal-600 hover:bg-teal-700 text-white rounded-lg font-medium transition">
        <i class="fas fa-save mr-2"></i>Guardar
      </button>
    </div>
  </div>
</div>

<!-- ─── MODAL CATEGORÍAS ─── -->
<div class="fixed bottom-4 right-4">
  <button onclick="toggleCategorias()" class="bg-gray-700 text-white px-4 py-2.5 rounded-full shadow-lg text-sm flex items-center gap-2">
    <i class="fas fa-tags"></i> Categorías
  </button>
</div>

<div id="panel-categorias" class="hidden fixed bottom-20 right-4 bg-white rounded-xl shadow-2xl w-72 z-40 overflow-hidden">
  <div class="px-4 py-3 bg-gray-50 border-b flex items-center justify-between">
    <span class="font-semibold text-gray-700 text-sm">Gestionar Categorías</span>
    <button onclick="toggleCategorias()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
  </div>
  <div class="p-4">
    <div id="lista-categorias" class="mb-3 space-y-1 max-h-40 overflow-y-auto"></div>
    <div class="space-y-2">
      <input id="nueva-cat-nombre" type="text" placeholder="Nombre de categoría" class="input-form text-xs">
      <div class="flex gap-2">
        <select id="nueva-cat-tipo" class="input-form text-xs flex-1">
          <option value="ingreso">Ingreso</option>
          <option value="gasto">Gasto</option>
        </select>
        <button onclick="crearCategoria()" class="bg-teal-600 text-white px-3 rounded-lg text-xs">
          <i class="fas fa-plus"></i>
        </button>
      </div>
    </div>
  </div>
</div>

<style>
  .label-form { display: block; font-size: 0.875rem; font-weight: 500; color: #374151; margin-bottom: 0.25rem; }
  .input-form { width: 100%; border: 1px solid #D1D5DB; border-radius: 0.5rem; padding: 0.625rem 0.75rem; font-size: 0.875rem; outline: none; }
  .input-form:focus { box-shadow: 0 0 0 2px rgba(13,148,136,0.25); border-color: #0d9488; }
</style>
{% endblock %}

{% block scripts %}
<script>
let todosMovimientos = [];
let tipoFiltroActivo = '';

async function cargarDatos() {
  const desde = document.getElementById('filtro-desde').value;
  const hasta = document.getElementById('filtro-hasta').value;
  let url = '/api/contabilidad/movimientos?limit=200';
  if (desde) url += `&desde=${desde}`;
  if (hasta) url += `&hasta=${hasta}`;

  const [resMovs, resResumen] = await Promise.all([
    api(url),
    api(`/api/contabilidad/resumen${desde || hasta ? '?' : ''}${desde ? 'desde=' + desde : ''}${desde && hasta ? '&' : ''}${hasta ? 'hasta=' + hasta : ''}`),
  ]);
  todosMovimientos = await resMovs.json();
  const resumen = await resResumen.json();

  document.getElementById('total-ingresos').textContent = formatoPYG(resumen.ingresos);
  document.getElementById('total-gastos').textContent = formatoPYG(resumen.gastos);
  const saldoEl = document.getElementById('total-saldo');
  saldoEl.textContent = formatoPYG(resumen.saldo);
  const card = document.getElementById('card-saldo');
  if (resumen.saldo >= 0) {
    card.className = 'bg-blue-50 border border-blue-200 rounded-xl p-5';
    saldoEl.className = 'text-2xl font-bold text-blue-800';
  } else {
    card.className = 'bg-orange-50 border border-orange-200 rounded-xl p-5';
    saldoEl.className = 'text-2xl font-bold text-orange-800';
  }

  renderizarMovimientos(todosMovimientos);
}

function renderizarMovimientos(movs) {
  const contenedor = document.getElementById('lista-movimientos');
  const filtrados = tipoFiltroActivo ? movs.filter(m => m.tipo === tipoFiltroActivo) : movs;

  if (!filtrados.length) {
    contenedor.innerHTML = `<div class="p-8 text-center text-gray-400">
      <i class="fas fa-receipt text-3xl mb-2"></i>
      <p>No hay movimientos en este período</p>
    </div>`;
    return;
  }

  contenedor.innerHTML = filtrados.map(m => `
    <div class="flex items-center justify-between px-5 py-3.5 hover:bg-gray-50 transition">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0
          ${m.tipo === 'ingreso' ? 'bg-emerald-100 text-emerald-600' : 'bg-red-100 text-red-500'}">
          <i class="fas fa-${m.tipo === 'ingreso' ? 'arrow-up' : 'arrow-down'} text-sm"></i>
        </div>
        <div>
          <div class="font-medium text-gray-800 text-sm">${m.descripcion}</div>
          <div class="text-xs text-gray-500">
            ${formatFecha(m.fecha)}
            ${m.categoria ? `· <span style="color:${m.categoria.color}">${m.categoria.nombre}</span>` : ''}
          </div>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <div class="text-right">
          <div class="font-semibold text-sm ${m.tipo === 'ingreso' ? 'text-emerald-700' : 'text-red-600'}">
            ${m.tipo === 'ingreso' ? '+' : '-'}${formatMonto(m.monto, m.moneda)}
          </div>
          <div class="text-xs text-gray-400">${m.moneda}</div>
        </div>
        <button onclick="eliminarMovimiento(${m.id})" class="text-gray-300 hover:text-red-500 transition ml-2">
          <i class="fas fa-trash text-xs"></i>
        </button>
      </div>
    </div>
  `).join('');
}

function filtrarTipo(tipo) {
  tipoFiltroActivo = tipo;
  ['todos','ingresos','gastos'].forEach(id => {
    document.getElementById(`btn-${id}`).className = 'px-3 py-1.5 text-xs rounded-full bg-gray-100 text-gray-600';
  });
  const activo = tipo === '' ? 'todos' : tipo === 'ingreso' ? 'ingresos' : 'gastos';
  document.getElementById(`btn-${activo}`).className = 'px-3 py-1.5 text-xs rounded-full bg-gray-800 text-white';
  renderizarMovimientos(todosMovimientos);
}

// ─── Modal movimiento ─────────────────────────────────────────────────────────

async function abrirModal(tipo) {
  document.getElementById('mov-tipo').value = tipo;
  document.getElementById('mov-titulo').textContent = tipo === 'ingreso' ? '+ Nuevo Ingreso' : '- Nuevo Gasto';
  document.getElementById('btn-guardar-mov').className = `px-5 py-2.5 ${tipo === 'ingreso' ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-red-500 hover:bg-red-600'} text-white rounded-lg font-medium transition`;
  document.getElementById('mov-descripcion').value = '';
  document.getElementById('mov-monto').value = '';
  document.getElementById('mov-moneda').value = 'PYG';
  document.getElementById('mov-fecha').value = new Date().toISOString().split('T')[0];
  document.getElementById('error-mov').classList.add('hidden');

  // Cargar categorías filtradas por tipo
  const res = await api('/api/contabilidad/categorias');
  const cats = await res.json();
  const select = document.getElementById('mov-categoria');
  select.innerHTML = '<option value="">— Sin categoría —</option>' +
    cats.filter(c => c.tipo === tipo).map(c =>
      `<option value="${c.id}">${c.nombre}</option>`
    ).join('');

  document.getElementById('modal-movimiento').classList.remove('hidden');
}

async function guardarMovimiento() {
  const tipo = document.getElementById('mov-tipo').value;
  const descripcion = document.getElementById('mov-descripcion').value.trim();
  const monto = parseFloat(document.getElementById('mov-monto').value);
  const fecha = document.getElementById('mov-fecha').value;

  if (!descripcion) { mostrarError('error-mov', 'La descripción es obligatoria.'); return; }
  if (!monto || monto <= 0) { mostrarError('error-mov', 'Ingrese un monto válido.'); return; }
  if (!fecha) { mostrarError('error-mov', 'La fecha es obligatoria.'); return; }

  const catId = document.getElementById('mov-categoria').value;
  const datos = {
    tipo,
    descripcion,
    monto,
    moneda: document.getElementById('mov-moneda').value,
    fecha,
    categoria_id: catId ? parseInt(catId) : null,
  };

  const res = await api('/api/contabilidad/movimientos', { method: 'POST', body: JSON.stringify(datos) });
  if (res.ok) {
    cerrarModal();
    cargarDatos();
  } else {
    const err = await res.json();
    mostrarError('error-mov', err.detail || 'Error al guardar.');
  }
}

async function eliminarMovimiento(id) {
  if (!confirm('¿Eliminar este movimiento?')) return;
  const res = await api(`/api/contabilidad/movimientos/${id}`, { method: 'DELETE' });
  if (res.ok) cargarDatos();
}

function cerrarModal() {
  document.getElementById('modal-movimiento').classList.add('hidden');
}

function mostrarError(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.classList.remove('hidden');
}

// ─── Categorías ───────────────────────────────────────────────────────────────

function toggleCategorias() {
  const panel = document.getElementById('panel-categorias');
  panel.classList.toggle('hidden');
  if (!panel.classList.contains('hidden')) cargarCategorias();
}

async function cargarCategorias() {
  const res = await api('/api/contabilidad/categorias');
  const cats = await res.json();
  const contenedor = document.getElementById('lista-categorias');
  if (!cats.length) { contenedor.innerHTML = '<p class="text-xs text-gray-400">Sin categorías</p>'; return; }
  contenedor.innerHTML = cats.map(c => `
    <div class="flex items-center justify-between text-xs py-1">
      <span><span class="inline-block w-2 h-2 rounded-full mr-2" style="background:${c.color}"></span>${c.nombre}</span>
      <span class="text-gray-400 mr-2">${c.tipo === 'ingreso' ? '↑' : '↓'}</span>
    </div>
  `).join('');
}

async function crearCategoria() {
  const nombre = document.getElementById('nueva-cat-nombre').value.trim();
  const tipo = document.getElementById('nueva-cat-tipo').value;
  if (!nombre) return;
  const colores = { ingreso: '#10B981', gasto: '#EF4444' };
  await api('/api/contabilidad/categorias', {
    method: 'POST',
    body: JSON.stringify({ nombre, tipo, color: colores[tipo] }),
  });
  document.getElementById('nueva-cat-nombre').value = '';
  cargarCategorias();
}

// ─── Exportar ─────────────────────────────────────────────────────────────────

function exportarCSV() {
  const desde = document.getElementById('filtro-desde').value;
  const hasta = document.getElementById('filtro-hasta').value;
  let url = '/api/contabilidad/exportar/csv?';
  if (desde) url += `desde=${desde}&`;
  if (hasta) url += `hasta=${hasta}`;
  window.location.href = url;
}

// ─── Utilidades ───────────────────────────────────────────────────────────────

function filtroMesActual() {
  const hoy = new Date();
  const inicio = new Date(hoy.getFullYear(), hoy.getMonth(), 1).toISOString().split('T')[0];
  const fin = new Date(hoy.getFullYear(), hoy.getMonth() + 1, 0).toISOString().split('T')[0];
  document.getElementById('filtro-desde').value = inicio;
  document.getElementById('filtro-hasta').value = fin;
  cargarDatos();
}

function formatMonto(n, moneda) {
  if (moneda === 'PYG') return '₲ ' + Number(n).toLocaleString('es-PY');
  if (moneda === 'USD') return '$ ' + Number(n).toFixed(2);
  if (moneda === 'BRL') return 'R$ ' + Number(n).toFixed(2);
  return Number(n).toLocaleString();
}

function formatFecha(f) {
  if (!f) return '—';
  const d = new Date(f + 'T00:00:00');
  return d.toLocaleDateString('es-PY', { day: '2-digit', month: 'short', year: 'numeric' });
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarModal(); });

// Inicializar con el mes actual
filtroMesActual();
</script>
{% endblock %}
