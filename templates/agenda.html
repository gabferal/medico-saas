{% extends "base.html" %}
{% block title %}Agenda{% endblock %}
{% block head %}
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/locales/es.global.min.js"></script>
{% endblock %}

{% block content %}
<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6">
  <h1 class="text-2xl font-bold text-gray-800">Agenda de Citas</h1>
  <button onclick="abrirModalNueva()"
    class="bg-teal-600 hover:bg-teal-700 text-white px-5 py-2.5 rounded-lg font-medium flex items-center gap-2 transition">
    <i class="fas fa-calendar-plus"></i> Nueva Cita
  </button>
</div>

<!-- Leyenda de estados -->
<div class="flex flex-wrap gap-3 mb-4">
  <span class="flex items-center gap-1.5 text-sm"><span class="w-3 h-3 rounded-full bg-blue-400 inline-block"></span>Agendada</span>
  <span class="flex items-center gap-1.5 text-sm"><span class="w-3 h-3 rounded-full bg-green-400 inline-block"></span>Confirmada</span>
  <span class="flex items-center gap-1.5 text-sm"><span class="w-3 h-3 rounded-full bg-teal-500 inline-block"></span>Realizada</span>
  <span class="flex items-center gap-1.5 text-sm"><span class="w-3 h-3 rounded-full bg-red-400 inline-block"></span>Cancelada</span>
  <span class="flex items-center gap-1.5 text-sm"><span class="w-3 h-3 rounded-full bg-yellow-400 inline-block"></span>No asistió</span>
</div>

<div class="bg-white rounded-xl shadow p-3 lg:p-5">
  <div id="calendario"></div>
</div>

<!-- ─── MODAL CITA ─── -->
<div id="modal-cita" class="hidden fixed inset-0 bg-black/50 z-50 flex items-start justify-center p-4 overflow-y-auto">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg my-8">
    <div class="flex items-center justify-between p-6 border-b">
      <h2 id="cita-titulo" class="text-xl font-bold text-gray-800">Nueva Cita</h2>
      <button onclick="cerrarModal()" class="text-gray-400 hover:text-gray-600 text-xl">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <div class="p-6 space-y-4">
      <input type="hidden" id="cita-id">

      <!-- Búsqueda de paciente -->
      <div>
        <label class="label-form">Paciente *</label>
        <input id="buscar-paciente" type="text" placeholder="Buscar por nombre o cédula..."
          class="input-form" oninput="buscarPacienteDropdown(this.value)" autocomplete="off">
        <input type="hidden" id="cita-paciente-id">
        <div id="dropdown-pacientes" class="hidden border border-gray-200 rounded-lg mt-1 max-h-48 overflow-y-auto shadow-lg bg-white z-10 relative"></div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="label-form">Fecha *</label>
          <input id="cita-fecha" type="date" class="input-form">
        </div>
        <div>
          <label class="label-form">Hora *</label>
          <input id="cita-hora" type="time" class="input-form" step="900">
        </div>
      </div>
      <div>
        <label class="label-form">Duración (minutos)</label>
        <select id="cita-duracion" class="input-form">
          <option value="15">15 minutos</option>
          <option value="30" selected>30 minutos</option>
          <option value="45">45 minutos</option>
          <option value="60">1 hora</option>
          <option value="90">1 hora 30 min</option>
        </select>
      </div>
      <div>
        <label class="label-form">Motivo de la cita</label>
        <input id="cita-motivo" type="text" placeholder="Ej: Control de presión, consulta general..." class="input-form">
      </div>
      <div>
        <label class="label-form">Estado</label>
        <select id="cita-estado" class="input-form">
          <option value="agendada">Agendada</option>
          <option value="confirmada">Confirmada</option>
          <option value="realizada">Realizada</option>
          <option value="cancelada">Cancelada</option>
          <option value="no_asistio">No asistió</option>
        </select>
      </div>
      <div>
        <label class="label-form">Notas internas</label>
        <textarea id="cita-notas" rows="2" class="input-form resize-none" placeholder="Observaciones adicionales..."></textarea>
      </div>
      <div id="error-cita" class="hidden text-red-600 text-sm bg-red-50 px-4 py-2 rounded-lg"></div>
    </div>
    <div class="flex items-center justify-between p-6 border-t">
      <button id="btn-eliminar-cita" onclick="eliminarCita()" class="hidden text-red-500 hover:text-red-700 text-sm">
        <i class="fas fa-trash mr-1"></i>Eliminar cita
      </button>
      <div class="flex gap-3 ml-auto">
        <button onclick="cerrarModal()" class="px-5 py-2.5 text-gray-600 hover:bg-gray-100 rounded-lg transition">Cancelar</button>
        <button onclick="guardarCita()" class="px-5 py-2.5 bg-teal-600 hover:bg-teal-700 text-white rounded-lg font-medium transition">
          <i class="fas fa-save mr-2"></i>Guardar
        </button>
      </div>
    </div>
  </div>
</div>

<style>
  .label-form { display: block; font-size: 0.875rem; font-weight: 500; color: #374151; margin-bottom: 0.25rem; }
  .input-form { width: 100%; border: 1px solid #D1D5DB; border-radius: 0.5rem; padding: 0.625rem 0.75rem; font-size: 0.875rem; outline: none; }
  .input-form:focus { ring: 2px; border-color: #0d9488; box-shadow: 0 0 0 2px rgba(13,148,136,0.2); }
  .fc-event { cursor: pointer !important; }
  .fc-toolbar-title { font-size: 1.1rem !important; }
  @media (max-width: 640px) {
    .fc-header-toolbar { flex-direction: column; gap: 0.5rem; }
  }
</style>
{% endblock %}

{% block scripts %}
<script>
const COLORES_ESTADO = {
  agendada: '#60A5FA',
  confirmada: '#34D399',
  realizada: '#0d9488',
  cancelada: '#F87171',
  no_asistio: '#FBBF24',
};

let calendario;
let debounceDropdown;

document.addEventListener('DOMContentLoaded', () => {
  calendario = new FullCalendar.Calendar(document.getElementById('calendario'), {
    locale: 'es',
    initialView: window.innerWidth < 640 ? 'listWeek' : 'timeGridWeek',
    headerToolbar: {
      left: 'prev,next today',
      center: 'title',
      right: 'dayGridMonth,timeGridWeek,timeGridDay,listWeek',
    },
    buttonText: { today: 'Hoy', month: 'Mes', week: 'Semana', day: 'Día', list: 'Lista' },
    slotMinTime: '07:00:00',
    slotMaxTime: '21:00:00',
    allDaySlot: false,
    height: 'auto',
    events: cargarEventos,
    eventClick(info) {
      abrirModalEditar(info.event);
    },
    dateClick(info) {
      abrirModalNueva(info.dateStr);
    },
    eventDidMount(info) {
      info.el.title = `${info.event.title} — ${info.event.extendedProps.estado}`;
    },
  });
  calendario.render();
});

async function cargarEventos(fetchInfo, successCallback, failureCallback) {
  try {
    const desde = fetchInfo.startStr.split('T')[0];
    const hasta = fetchInfo.endStr.split('T')[0];
    const res = await api(`/api/citas?desde=${desde}&hasta=${hasta}`);
    const citas = await res.json();
    const eventos = citas.map(c => ({
      id: c.id,
      title: c.paciente_nombre || 'Paciente',
      start: c.fecha_hora,
      end: calcularFin(c.fecha_hora, c.duracion_minutos),
      backgroundColor: COLORES_ESTADO[c.estado] || '#6B7280',
      borderColor: 'transparent',
      extendedProps: { ...c },
    }));
    successCallback(eventos);
  } catch (e) {
    failureCallback(e);
  }
}

function calcularFin(inicio, minutos) {
  const d = new Date(inicio);
  d.setMinutes(d.getMinutes() + minutos);
  return d.toISOString();
}

function abrirModalNueva(fechaStr = null) {
  document.getElementById('cita-titulo').textContent = 'Nueva Cita';
  document.getElementById('cita-id').value = '';
  document.getElementById('buscar-paciente').value = '';
  document.getElementById('cita-paciente-id').value = '';
  document.getElementById('cita-motivo').value = '';
  document.getElementById('cita-notas').value = '';
  document.getElementById('cita-estado').value = 'agendada';
  document.getElementById('cita-duracion').value = '30';
  document.getElementById('btn-eliminar-cita').classList.add('hidden');
  document.getElementById('error-cita').classList.add('hidden');

  if (fechaStr) {
    const d = new Date(fechaStr);
    document.getElementById('cita-fecha').value = d.toISOString().split('T')[0];
    document.getElementById('cita-hora').value = d.toTimeString().substring(0, 5);
  } else {
    const ahora = new Date();
    document.getElementById('cita-fecha').value = ahora.toISOString().split('T')[0];
    document.getElementById('cita-hora').value = '08:00';
  }
  document.getElementById('modal-cita').classList.remove('hidden');
}

function abrirModalEditar(evento) {
  const p = evento.extendedProps;
  document.getElementById('cita-titulo').textContent = 'Editar Cita';
  document.getElementById('cita-id').value = evento.id;
  document.getElementById('buscar-paciente').value = p.paciente_nombre || '';
  document.getElementById('cita-paciente-id').value = p.paciente_id;
  document.getElementById('cita-motivo').value = p.motivo || '';
  document.getElementById('cita-notas').value = p.notas || '';
  document.getElementById('cita-estado').value = p.estado;
  document.getElementById('cita-duracion').value = p.duracion_minutos || 30;
  document.getElementById('btn-eliminar-cita').classList.remove('hidden');
  document.getElementById('error-cita').classList.add('hidden');

  const inicio = new Date(p.fecha_hora);
  document.getElementById('cita-fecha').value = inicio.toISOString().split('T')[0];
  document.getElementById('cita-hora').value = inicio.toLocaleTimeString('es-PY', { hour:'2-digit', minute:'2-digit', hour12: false });
  document.getElementById('modal-cita').classList.remove('hidden');
}

async function guardarCita() {
  const id = document.getElementById('cita-id').value;
  const pacienteId = document.getElementById('cita-paciente-id').value;
  const fecha = document.getElementById('cita-fecha').value;
  const hora = document.getElementById('cita-hora').value;

  if (!pacienteId) { mostrarError('Por favor seleccione un paciente de la lista.'); return; }
  if (!fecha || !hora) { mostrarError('La fecha y hora son obligatorias.'); return; }

  const datos = {
    paciente_id: parseInt(pacienteId),
    fecha_hora: `${fecha}T${hora}:00`,
    duracion_minutos: parseInt(document.getElementById('cita-duracion').value),
    motivo: document.getElementById('cita-motivo').value || null,
    estado: document.getElementById('cita-estado').value,
    notas: document.getElementById('cita-notas').value || null,
  };

  const url = id ? `/api/citas/${id}` : '/api/citas';
  const method = id ? 'PUT' : 'POST';
  const res = await api(url, { method, body: JSON.stringify(datos) });

  if (res.ok) {
    cerrarModal();
    calendario.refetchEvents();
  } else {
    const err = await res.json();
    mostrarError(err.detail || 'Error al guardar la cita.');
  }
}

async function eliminarCita() {
  const id = document.getElementById('cita-id').value;
  if (!confirm('¿Desea eliminar esta cita?')) return;
  const res = await api(`/api/citas/${id}`, { method: 'DELETE' });
  if (res.ok) { cerrarModal(); calendario.refetchEvents(); }
}

// ─── Búsqueda de pacientes ────────────────────────────────────────────

async function buscarPacienteDropdown(valor) {
  clearTimeout(debounceDropdown);
  const dd = document.getElementById('dropdown-pacientes');
  document.getElementById('cita-paciente-id').value = '';
  if (!valor.trim()) { dd.classList.add('hidden'); return; }

  debounceDropdown = setTimeout(async () => {
    const res = await api(`/api/pacientes?buscar=${encodeURIComponent(valor)}&limit=8`);
    const pacientes = await res.json();
    if (!pacientes.length) { dd.classList.add('hidden'); return; }
    dd.innerHTML = pacientes.map(p => `
      <div onclick="seleccionarPaciente(${p.id}, '${p.nombre_completo.replace(/'/g, "\\'")}')"
        class="px-4 py-2.5 hover:bg-teal-50 cursor-pointer text-sm border-b last:border-0">
        <div class="font-medium text-gray-800">${p.nombre_completo}</div>
        ${p.numero_documento ? `<div class="text-gray-500 text-xs">Doc: ${p.numero_documento}</div>` : ''}
      </div>
    `).join('');
    dd.classList.remove('hidden');
  }, 250);
}

function seleccionarPaciente(id, nombre) {
  document.getElementById('cita-paciente-id').value = id;
  document.getElementById('buscar-paciente').value = nombre;
  document.getElementById('dropdown-pacientes').classList.add('hidden');
}

document.addEventListener('click', e => {
  if (!e.target.closest('#buscar-paciente') && !e.target.closest('#dropdown-pacientes')) {
    document.getElementById('dropdown-pacientes').classList.add('hidden');
  }
});

function cerrarModal() {
  document.getElementById('modal-cita').classList.add('hidden');
  document.getElementById('dropdown-pacientes').classList.add('hidden');
}

function mostrarError(msg) {
  const el = document.getElementById('error-cita');
  el.textContent = msg;
  el.classList.remove('hidden');
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarModal(); });
</script>
{% endblock %}
